<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="edoglo-build" content="2026-11-03-v14">
  <title>Edoglò CRM</title>
  <style>
    :root{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#0f172a;background:#f4f7fb;
      --ink:#0f172a;--muted:#64748b;--line:#dbe3ee;--panel:#fff;
      --navy:#0f172a;--blue:#2563eb;--green:#15803d;--amber:#b45309;--red:#b91c1c;
      --shadow:0 8px 30px rgba(15,23,42,.06);
    }
    *{box-sizing:border-box}
    html{background:#f4f7fb}
    body{margin:0;background:linear-gradient(180deg,#eef4fb 0,#f8fafc 220px,#f4f7fb 100%);min-height:100vh}
    button,input,select,textarea{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .wrap{max-width:1080px;margin:auto;padding:18px 18px 104px}
    .role-technician .wrap{max-width:700px}
    .top{
      display:flex;justify-content:space-between;align-items:center;gap:14px;
      position:sticky;top:0;z-index:20;margin:0 -4px 16px;padding:12px 4px 14px;
      background:rgba(244,247,251,.92);backdrop-filter:blur(12px);
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand-mark{
      width:42px;height:42px;border-radius:13px;background:#0f172a;color:#fff;
      display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 7px 18px rgba(15,23,42,.18)
    }
    .brand-copy{min-width:0}
    h1{font-size:22px;line-height:1.1;margin:0;letter-spacing:-.02em}
    .sub{color:var(--muted);font-size:13px;margin-top:3px}
    .role-chip{
      display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 8px;border-radius:999px;
      font-size:10px;font-weight:900;letter-spacing:.08em;background:#e2e8f0;color:#334155
    }
    .role-technician .role-chip{background:#dcfce7;color:#166534}
    .grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr)}
    .card{
      background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:18px;
      padding:16px;margin:11px 0;box-shadow:var(--shadow)
    }
    .stat{min-height:112px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
    .stat:after{content:"";position:absolute;right:-16px;bottom:-22px;width:72px;height:72px;border-radius:50%;background:#f1f5f9}
    .stat b{font-size:30px;line-height:1;display:block;letter-spacing:-.04em;position:relative;z-index:1}
    .stat span{font-size:13px;color:#475569;margin-top:8px;font-weight:700;position:relative;z-index:1}
    .btn{
      border:0;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer;
      background:#e2e8f0;color:#111827;text-decoration:none;display:inline-flex;align-items:center;
      justify-content:center;gap:6px;min-height:42px;transition:transform .12s ease,box-shadow .12s ease
    }
    .btn:active{transform:scale(.98)}
    .primary{background:#0f172a;color:#fff;box-shadow:0 6px 16px rgba(15,23,42,.14)}
    .ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}
    .bad{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1d4ed8}
    .ghost{background:#fff;border:1px solid #cbd5e1}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .field{display:grid;gap:6px;margin:11px 0}
    .field label{font-weight:800;font-size:12px;color:#334155;text-transform:none}
    .field input,.field select,.field textarea,.lead-tools input,.lead-tools select{
      width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px 13px;background:#fff;
      color:#0f172a;outline:none;transition:border-color .12s,box-shadow .12s
    }
    .field input:focus,.field select:focus,.field textarea:focus,.lead-tools input:focus,.lead-tools select:focus{
      border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.16)
    }
    .field textarea{min-height:92px;resize:vertical}
    .tabs{
      display:flex;gap:7px;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);
      border-top:1px solid #dbe3ee;padding:9px max(10px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));
      justify-content:center;z-index:30;box-shadow:0 -10px 30px rgba(15,23,42,.07);backdrop-filter:blur(14px)
    }
    .tab{
      border:0;background:transparent;padding:10px 14px;border-radius:12px;font-weight:800;color:#64748b;
      min-width:84px;cursor:pointer
    }
    .tab.active{background:#0f172a;color:#fff;box-shadow:0 5px 14px rgba(15,23,42,.14)}
    .role-technician .tabs{max-width:700px;margin:auto;border-left:1px solid #dbe3ee;border-right:1px solid #dbe3ee;border-radius:18px 18px 0 0}
    .role-technician .tab{flex:1;max-width:260px;font-size:15px;padding:13px}
    .pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#f1f5f9;font-size:12px;font-weight:800}
    .meta{color:#64748b;font-size:13px;line-height:1.45}
    .name{font-size:18px;font-weight:900;letter-spacing:-.015em}
    .section{font-size:18px;font-weight:900;margin:24px 0 8px;letter-spacing:-.02em}
    .section:first-child{margin-top:8px}
    .login{
      max-width:430px;margin:8vh auto;padding:24px;background:#fff;border:1px solid #dbe3ee;border-radius:22px;
      box-shadow:0 20px 60px rgba(15,23,42,.10)
    }
    .msg{margin:10px 0;padding:10px;border-radius:12px}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
    .notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:13px 14px;border-radius:14px;margin:11px 0;line-height:1.45}
    .appt{border-left:5px solid #c4b5fd;position:relative}
    .today{border-left-color:#22c55e}
    .role-technician .appt{border-left:0;border-top:5px solid #c4b5fd;padding:18px}
    .role-technician .appt.today{border-top-color:#22c55e;background:linear-gradient(180deg,#f0fdf4 0,#fff 90px)}
    .appt-date{
      display:flex;justify-content:space-between;align-items:center;gap:10px;background:#eff6ff;
      border:1px solid #bfdbfe;border-radius:14px;padding:12px 14px;margin:10px 0
    }
    .appt-date-main{font-size:18px;font-weight:950;color:#1e3a8a;text-transform:capitalize}
    .appt-time{font-size:18px;font-weight:950;color:#0f172a;white-space:nowrap}
    .today .appt-date{background:#ecfdf5;border-color:#86efac}
    .today .appt-date-main{color:#166534}
    .today-tag{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;background:#166534;color:#fff;font-size:10px;font-weight:900;vertical-align:middle}
    .role-technician .appt .name{font-size:21px}
    .role-technician .appt .meta{font-size:14px}
    .role-technician .appt .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .role-technician .appt .row .btn{width:100%;min-height:48px;font-size:14px}
    .role-technician .appt .row .btn[data-done]{grid-column:1/-1;background:#166534;color:#fff}
    .slot{display:inline-block;padding:7px 9px;border-radius:9px;margin:3px;background:#dcfce7;font-size:12px;font-weight:700}
    .slot.busy{background:#f1f5f9;color:#94a3b8;text-decoration:line-through}
    .lead-tools{display:grid;grid-template-columns:1fr 190px;gap:9px;margin:12px 0}
    .callback-due{border-left:5px solid #f59e0b}
    .callback-badge{display:inline-block;background:#fef3c7;color:#92400e;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;margin-top:8px}
    .appt-status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;margin:5px 0 8px;letter-spacing:.02em}
    .appt-status.confirmed,.appt-status.scheduled{background:#dbeafe;color:#1d4ed8}
    .appt-status.completed{background:#dcfce7;color:#166534}
    .appt-status.cancelled{background:#fee2e2;color:#991b1b}
    .appt-status.reschedule{background:#fef3c7;color:#92400e}
    .outcome-box{margin-top:10px;padding:11px 13px;border-radius:13px;background:#f8fafc;border:1px solid #cbd5e1;line-height:1.45}
    .outcome-box b{display:block;margin-bottom:4px;color:#334155}
    .measure-card{background:#fff;border:1px solid #cbd5e1;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 14px rgba(15,23,42,.04)}
    .measure-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .measure-value{font-size:20px;font-weight:950;letter-spacing:-.02em;margin:4px 0}
    .session-card{border:2px solid #e2e8f0}
    .session-card.reference{border-color:#22c55e;background:#f0fdf4}
    .session-badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;margin:5px 5px 5px 0;letter-spacing:.04em}
    .session-badge.preliminary{background:#e0f2fe;color:#075985}
    .session-badge.definitive{background:#ede9fe;color:#5b21b6}
    .session-badge.reference{background:#166534;color:#fff}
    .agenda-filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}
    .agenda-filter{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}
    .agenda-filter.active{background:#0f172a;color:#fff;border-color:#0f172a}
    .role-technician .section{font-size:19px}
    .role-technician form.card{padding:17px}
    .role-technician form.card>.primary{width:100%;min-height:48px}
    .role-technician .measure-card .row .btn{flex:1}
    .role-technician #saveSurvey{width:100%;min-height:50px;background:#166534;color:#fff}
    .survey-step{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
    .survey-step-title{font-size:12px;font-weight:900;color:#64748b;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
    .product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .product-btn{border:1px solid #cbd5e1;background:#fff;border-radius:14px;padding:14px 10px;font-weight:900;min-height:58px;cursor:pointer;color:#0f172a}
    .product-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}
    .survey-current{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:15px;padding:12px 14px;margin:10px 0}
    .position-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .position-number{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#0f172a;color:#fff;font-size:18px;font-weight:950}
    @media(max-width:640px){
      body{font-size:17px}
      .wrap{padding:12px 10px 108px}
      .top{padding-top:8px;margin-bottom:12px}
      .brand-mark{width:42px;height:42px;border-radius:12px;font-size:19px}
      h1{font-size:22px}
      .sub{font-size:14px}
      .role-chip{font-size:11px;padding:5px 9px}
      .stats{gap:9px}
      .stat{min-height:106px;padding:15px}
      .stat b{font-size:30px}
      .stat span{font-size:14px}
      .card{border-radius:16px;padding:16px}
      .name{font-size:20px}
      .meta{font-size:15px}
      .section{font-size:19px;margin-top:22px}
      .btn{font-size:15px;min-height:48px;padding:12px 14px}
      .field{gap:7px;margin:12px 0}
      .field label{font-size:14px}
      .field input,.field select,.field textarea,.lead-tools input,.lead-tools select{
        font-size:17px;padding:14px 13px;border-radius:13px;min-height:50px
      }
      .field textarea{min-height:108px}
      .appt-date{align-items:flex-start;flex-direction:column;padding:14px}
      .appt-date-main{font-size:20px}
      .appt-time{font-size:20px}
      .appt-status{font-size:12px;padding:6px 10px}
      .today-tag{font-size:11px;padding:4px 8px}
      .lead-tools{grid-template-columns:1fr}
      .measure-grid{grid-template-columns:1fr}
      .measure-card{padding:16px}
      .measure-value{font-size:22px}
      .survey-step{padding:17px}
      .survey-step-title{font-size:13px}
      .survey-current{padding:14px}
      .product-btn{font-size:15px;min-height:64px;padding:14px 9px}
      .position-number{width:48px;height:48px;font-size:20px}
      .tabs{justify-content:stretch;padding-top:10px}
      .tab{flex:1;min-width:0;padding:12px 8px;font-size:14px;min-height:48px}
      .top>.btn{padding:10px 12px;min-height:42px;font-size:14px}
      .role-technician .appt{padding:18px}
      .role-technician .appt .name{font-size:22px}
      .role-technician .appt .meta{font-size:15px}
      .role-technician .appt .row .btn{min-height:52px;font-size:16px}
      .role-technician form.card>.primary,
      .role-technician #saveSurvey{min-height:54px;font-size:16px}
    }
    @media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const sb=createClient(
  "https://erapqwuizpdccnrtzwns.supabase.co",
  "sb_publishable_6wz50wCBm44-DufMKB2dAQ_tmcflhkw",
  {auth:{persistSession:true}}
);

const app=document.querySelector("#app");
let user=null, profile=null, leads=[], appts=[], techs=[], unavail=[], view="home";
const surveyStateBySession={};

const esc=v=>String(v??"").replace(/[&<>'"]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[s]));
const digits=v=>String(v||"").replace(/[^0-9]/g,"");
const waNumber=v=>{
  let d=digits(v);
  if(d.startsWith("00")) d=d.slice(2);
  if(d.startsWith("39")) return d;
  if(d.startsWith("3") && d.length>=9) return "39"+d;
  return d;
};
const fmt=x=>new Intl.DateTimeFormat("it-IT",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"}).format(new Date(x));
const fmtDate=x=>new Intl.DateTimeFormat("it-IT",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric",timeZone:"Europe/Rome"}).format(new Date(x));
const fmtTime=x=>new Intl.DateTimeFormat("it-IT",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"}).format(new Date(x));
const day=x=>new Intl.DateTimeFormat("sv-SE",{year:"numeric",month:"2-digit",day:"2-digit",timeZone:"Europe/Rome"}).format(new Date(x));
const now=()=>new Date().toISOString();

const apptLabel={scheduled:"Programmato",confirmed:"Confermato",completed:"Eseguito",cancelled:"Annullato",reschedule:"Da riprogrammare"};

const label={
  new:"Nuovo",
  valid:"Valido",
  bot:"Bot/Falso",
  out_of_area:"Fuori zona",
  no_answer:"Non risponde",
  callback:"Da richiamare",
  not_interested:"Non interessato",
  appointment:"Sopralluogo fissato",
  won:"Acquisito",
  lost:"Perso"
};

async function start(){
  const {data:{user:u}}=await sb.auth.getUser();
  user=u;
  if(!user){ login(); return; }
  const {data:p}=await sb.from("staff_profiles").select("*").eq("id",user.id).maybeSingle();
  if(!p){ unauthorized(); return; }
  profile=p;
  await load();
  render();
}

function login(){
  app.innerHTML=`
  <div class="login">
    <h1>Edoglò CRM</h1>
    <p class="sub">Accesso riservato</p>
    <div id="m"></div>
    <div class="field"><label>Email</label><input id="email" type="email"></div>
    <div class="field"><label>Password</label><input id="pw" type="password" minlength="8"></div>
    <div class="row">
      <button class="btn primary" id="go">Accedi</button>
      <button class="btn ghost" id="signup">Primo accesso</button>
    </div>
    <div class="notice">Il primo account creato nel CRM diventa amministratore. Crealo tu prima dell'accesso di Antonio.</div>
  </div>`;

  const emailEl=document.querySelector("#email");
  const pwEl=document.querySelector("#pw");
  const msgEl=document.querySelector("#m");
  document.querySelector("#go").onclick=async()=>{
    const {error}=await sb.auth.signInWithPassword({email:emailEl.value.trim(),password:pwEl.value});
    msgEl.innerHTML=error?`<div class="msg error">${esc(error.message)}</div>`:`<div class="msg success">Accesso eseguito</div>`;
    if(!error) location.reload();
  };

  document.querySelector("#signup").onclick=async()=>{
    if(!emailEl.value || pwEl.value.length<8){
      msgEl.innerHTML='<div class="msg error">Inserisci email e password di almeno 8 caratteri.</div>';
      return;
    }
    const {error}=await sb.auth.signUp({
      email:emailEl.value.trim(),
      password:pwEl.value,
      options:{data:{full_name:emailEl.value.split("@")[0]},emailRedirectTo:"https://edoglo-crm.onrender.com"}
    });
    msgEl.innerHTML=error?`<div class="msg error">${esc(error.message)}</div>`:`<div class="msg success">Account creato. Se ricevi una mail, confermala e poi accedi.</div>`;
  };
}

function unauthorized(){
  app.innerHTML=`
  <div class="login">
    <h1>Edoglò CRM</h1>
    <div class="notice">Account creato ma non ancora autorizzato nel CRM.</div>
    <button class="btn ghost" id="out">Esci</button>
  </div>`;
  document.querySelector("#out").onclick=async()=>{await sb.auth.signOut();location.reload();};
}

async function load(){
  const [l,a]=await Promise.all([
    sb.from("leads").select("*").order("created_at",{ascending:false}),
    sb.from("appointments").select("*").order("starts_at",{ascending:true})
  ]);
  if(l.error) throw l.error;
  if(a.error) throw a.error;
  leads=l.data||[];
  appts=a.data||[];

  if(profile.role==="admin"){
    const t=await sb.from("staff_profiles")
      .select("id,full_name,email,role,active")
      .eq("role","technician")
      .eq("active",true)
      .order("full_name");
    techs=t.data||[];
  }
}

function nav(){
  const items=profile.role==="admin"
    ? [["home","Home"],["leads","Lead"],["agenda","Agenda"],["staff","Tecnici"]]
    : [["agenda","Oggi"],["availability","Agenda"]];
  return `<div class="tabs">${items.map(([v,n])=>`<button class="tab ${view===v?"active":""}" data-v="${v}">${n}</button>`).join("")}</div>`;
}

function shell(body){
  document.body.className=profile.role==="technician"?"role-technician":"role-admin";
  const displayName=profile.full_name||profile.email||"";
  app.innerHTML=`
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="brand-mark">E</div>
        <div class="brand-copy">
          <h1>Edoglò CRM</h1>
          <div class="sub">${profile.role==="admin"?"Gestione commerciale e sopralluoghi":"Agenda e rilievi tecnici"}</div>
          <div class="role-chip">${profile.role==="admin"?"ADMIN":"TECNICO"}${displayName?" · "+esc(displayName):""}</div>
        </div>
      </div>
      <button class="btn ghost" id="logout">Esci</button>
    </div>
    ${body}
  </div>
  ${nav()}`;
  document.querySelector("#logout").onclick=async()=>{await sb.auth.signOut();location.reload();};
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});
}

function render(){
  if(profile.role==="technician" && view==="home") view="agenda";
  ({home,leads:leadsView,agenda,availability,staff}[view]||home)();
}

function home(){
  const today=appts.filter(a=>day(a.starts_at)===day(now())&&a.status!=="cancelled").length;
  const dueCallbacks=leads.filter(l=>l.status==="callback"&&(!l.callback_at||new Date(l.callback_at)<=new Date()));
  shell(`
    <div class="grid stats">
      <div class="card stat"><b>${leads.filter(l=>l.status==="new").length}</b><span>Nuovi lead</span></div>
      <div class="card stat"><b>${dueCallbacks.length}</b><span>Da richiamare</span></div>
      <div class="card stat"><b>${today}</b><span>Sopralluoghi oggi</span></div>
      <div class="card stat"><b>${leads.filter(l=>["valid","appointment","won"].includes(l.status)).length}</b><span>Qualificati</span></div>
    </div>
    <div class="row"><button class="btn primary" id="newLead">+ Nuovo cliente</button></div>
    ${dueCallbacks.length?`<div class="section">Richiami da fare</div>${leadCards(dueCallbacks.slice(0,5))}`:""}
    <div class="section">Prossimi sopralluoghi</div>
    ${apptCards(appts.filter(a=>new Date(a.ends_at)>=new Date()&&a.status!=="cancelled").slice(0,6))}
    <div class="section">Disponibilità prossimi 7 giorni</div>
    ${availabilityHtml()}
  `);
  document.querySelector("#newLead").onclick=()=>leadForm();
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>leadDetail(b.dataset.open));
}

function leadCards(xs=leads){
  return xs.map(l=>{
    const due=l.status==="callback"&&(!l.callback_at||new Date(l.callback_at)<=new Date());
    return `
    <div class="card ${due?"callback-due":""}">
      <div class="name">${esc(l.full_name)}</div>
      <div class="meta">${esc(l.city||"")} ${esc(l.province||"")} · ${esc(l.source||"")} · ${esc(label[l.status]||l.status)}</div>

function agenda(){
  if(profile.role==="technician"){
    const xs=appts.filter(a=>new Date(a.ends_at)>=new Date(Date.now()-86400000)&&!["cancelled","completed"].includes(a.status));
    shell(`<div class="section">Agenda sopralluoghi</div>${apptCards(xs)}`);
  }else{
    shell(`
      <div class="section">Agenda sopralluoghi</div>
      <div class="agenda-filters">
        <button class="agenda-filter active" data-af="upcoming">Prossimi</button>
        <button class="agenda-filter" data-af="completed">Eseguiti</button>
        <button class="agenda-filter" data-af="cancelled">Annullati</button>
        <button class="agenda-filter" data-af="all">Tutti</button>
      </div>
      <div id="agendaList"></div>
    `);
    const list=document.querySelector("#agendaList");
    const paint=(mode)=>{
      let xs=[...appts];
      if(mode==="upcoming") xs=xs.filter(a=>new Date(a.ends_at)>=new Date()&&!["cancelled","completed"].includes(a.status));
      if(mode==="completed") xs=xs.filter(a=>a.status==="completed").sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at));
      if(mode==="cancelled") xs=xs.filter(a=>a.status==="cancelled").sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at));
      if(mode==="all") xs=xs.sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at));
      list.innerHTML=apptCards(xs);
      bindAgendaActions();
    };
    document.querySelectorAll("[data-af]").forEach(b=>b.onclick=()=>{
      document.querySelectorAll("[data-af]").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      paint(b.dataset.af);
    });
    paint("upcoming");
  }
  bindAgendaActions();
}

function bindAgendaActions(){
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>setAppt(b.dataset.done,"completed"));
  document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>setAppt(b.dataset.cancel,"cancelled"));
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editAppt(b.dataset.edit));
  document.querySelectorAll("[data-measures]").forEach(b=>b.onclick=()=>measurementsView(b.dataset.measures));
}

    "Serramento":["opening_type","profile","glass_spec","handle_color","opening_direction","sill","wall_thickness_mm","installation_type"],
    "Tapparella":["roller_shutter","roller_shutter_control","product_detail"],
    "Zanzariera":["mosquito_net","product_detail"],
    "Porta blindata":["product_detail","opening_direction","sill","wall_thickness_mm","installation_type"],
    "Porta interna":["product_detail","opening_direction","sill"],
    "Portoncino":["product_detail","opening_direction","sill","wall_thickness_mm","installation_type"],
    "Persiana":["persiana","opening_direction","product_detail"],
    "Tenda da sole":["product_detail"],
    "Condizionatore":["product_detail"],
    "Cassonetto / monoblocco":["cassonetto","monoblocco","product_detail","wall_thickness_mm"],
    "Altro":["product_detail"]
  };
  const always=["room","quantity","width_mm","height_mm","notes","position_name"];
  document.querySelectorAll("#mf .field").forEach(el=>{
    const control=el.querySelector("[name]");
    if(!control) return;
    const name=control.name;
    if(always.includes(name)) return;
    if(!(fieldNames[selectedProduct]||[]).includes(name)) el.remove();
  });
  document.querySelectorAll("#mf [data-form-section]").forEach(s=>{
    const grid=s.nextElementSibling;
    if(!grid || !grid.classList.contains("measure-grid") || !grid.querySelector(".field")){
      if(grid?.classList.contains("measure-grid")) grid.remove();
      s.remove();
    }
  });

  document.querySelector("#mf").onsubmit=async e=>{
    e.preventDefault();
    const x=Object.fromEntries(new FormData(e.currentTarget).entries());
    x.appointment_id=appointmentId;
    x.session_id=current.id;
    x.created_by=user.id;
    x.product_type=selectedProduct;
    x.product_color=selectedColor;
    x.position_name="Pos. "+nextPos;
    if(selectedProduct==="Serramento") x.frame_color=selectedColor;
    if(selectedProduct==="Tapparella") x.roller_shutter_color=selectedColor;
    x.quantity=Number(x.quantity||1);
    x.width_mm=x.width_mm?Number(x.width_mm):null;
    x.height_mm=x.height_mm?Number(x.height_mm):null;
    x.wall_thickness_mm=x.wall_thickness_mm?Number(x.wall_thickness_mm):null;
    const {error}=await sb.from("appointment_measurements").insert(x);
    if(error) return alert(error.message);
    measurementsView(appointmentId,current.id);
  };

  document.querySelectorAll("[data-edit-measure]").forEach(b=>b.onclick=async()=>{
    const r=rows.find(x=>x.id===b.dataset.editMeasure);
    if(!r) return;
    const width=prompt("Larghezza in mm:",r.width_mm??"");
    if(width===null) return;
    const height=prompt("Altezza in mm:",r.height_mm??"");
    if(height===null) return;
    const qty=prompt("Quantità:",r.quantity??1);
    if(qty===null) return;
    const notes=prompt("Note tecniche:",r.notes??"");
    if(notes===null) return;
    const patch={
      width_mm:width?Number(width):null,
      height_mm:height?Number(height):null,
      quantity:Number(qty||1),
      notes
    };
    const {error}=await sb.from("appointment_measurements").update(patch).eq("id",r.id);
    if(error) return alert(error.message);
    measurementsView(appointmentId,current.id);
  });

  document.querySelectorAll("[data-del-measure]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Eliminare questa misura?")) return;
    const {error}=await sb.from("appointment_measurements").delete().eq("id",b.dataset.delMeasure);
    if(error) return alert(error.message);
    measurementsView(appointmentId,current.id);
  });

  document.querySelector("#saveSurvey").onclick=async()=>{
    const {error}=await sb.rpc("save_measurement_session",{p_session_id:current.id});
    if(error) return alert(error.message.includes("NESSUNA_MISURA")?"Inserisci almeno una posizione prima di salvare.":error.message);
    alert(current.session_type==="definitive"?"Misure definitive salvate: ora sono il riferimento corretto.":"Prime misure salvate.");
    measurementsView(appointmentId,current.id);
  };
}

async function setAppt(id,status){
  const patch={status};
  if(status==="completed" && profile.role==="technician"){
    const note=prompt("Esito sopralluogo / note per l'ufficio:");
    if(note===null) return;
    patch.outcome_notes=note.trim();
  }
  const {error}=await sb.from("appointments").update(patch).eq("id",id);
  if(error) return alert(error.message);
  await load(); render();
}

function apptForm(l){
  if(!techs.length){
    alert("Prima Antonio deve creare il proprio account usando la mail autorizzata.");
    return;
  }

  const st=new Date(Date.now()+86400000); st.setHours(9,0,0,0);
  const en=new Date(st.getTime()+3600000);

  shell(`
    <div class="section">Fissa sopralluogo</div>
    <form id="af" class="card">
      <input type="hidden" name="lead_id" value="${esc(l.id)}">
      <div class="field"><label>Tecnico</label><select name="technician_id">${techs.map(t=>`<option value="${t.id}">${esc(t.full_name)}</option>`).join("")}</select></div>
      <div class="field"><label>Cliente</label><input name="client_name" value="${esc(l.full_name)}" required></div>
      <div class="field"><label>Telefono</label><input name="phone" value="${esc(l.phone||"")}"></div>
      <div class="field"><label>Indirizzo</label><input name="address" value="${esc(l.address||"")}" required></div>
      <div class="field"><label>Comune</label><input name="city" value="${esc(l.city||"")}"></div>
      <div class="field"><label>Provincia</label><input name="province" value="${esc(l.province||"")}"></div>
      <div class="field"><label>Inizio</label><input name="starts_at" type="datetime-local" value="${local(st)}" required></div>
      <div class="field"><label>Fine</label><input name="ends_at" type="datetime-local" value="${local(en)}" required></div>
      <div class="field"><label>Note per Antonio</label><textarea name="notes">${esc(l.request||"")}</textarea></div>
      <button class="btn primary">Conferma sopralluogo</button>
    </form>`);

  document.querySelector("#af").onsubmit=async e=>{
    e.preventDefault();
    const x=Object.fromEntries(new FormData(e.currentTarget).entries());
    const t=techs.find(t=>t.id===x.technician_id);
    x.technician_name=t?.full_name||"Antonio";
    x.starts_at=new Date(x.starts_at).toISOString();
    x.ends_at=new Date(x.ends_at).toISOString();
    x.status="confirmed";
    x.source="Lead";
    x.created_by=user.id;

    const {error}=await sb.from("appointments").insert(x);
    if(error) return alert(error.code==="23P01"?"Questo orario è già occupato.":error.message);

    await sb.from("leads").update({status:"appointment"}).eq("id",l.id);
    await load(); view="agenda"; render();
  };
}


function editAppt(id){
  const a=appts.find(x=>x.id===id);
  if(!a) return;
  shell(`
    <div class="section">Modifica sopralluogo</div>
    <form id="ef" class="card">
      <div class="field"><label>Tecnico</label><select name="technician_id">${techs.map(t=>`<option value="${t.id}" ${t.id===a.technician_id?"selected":""}>${esc(t.full_name)}</option>`).join("")}</select></div>
      <div class="field"><label>Cliente</label><input name="client_name" value="${esc(a.client_name||"")}" required></div>
      <div class="field"><label>Telefono</label><input name="phone" value="${esc(a.phone||"")}"></div>
      <div class="field"><label>Indirizzo</label><input name="address" value="${esc(a.address||"")}" required></div>
      <div class="field"><label>Comune</label><input name="city" value="${esc(a.city||"")}"></div>
      <div class="field"><label>Provincia</label><input name="province" value="${esc(a.province||"")}"></div>
      <div class="field"><label>Inizio</label><input name="starts_at" type="datetime-local" value="${local(new Date(a.starts_at))}" required></div>
      <div class="field"><label>Fine</label><input name="ends_at" type="datetime-local" value="${local(new Date(a.ends_at))}" required></div>
      <div class="field"><label>Stato</label><select name="status">
        <option value="confirmed" ${a.status==="confirmed"?"selected":""}>Confermato</option>
        <option value="reschedule" ${a.status==="reschedule"?"selected":""}>Da riprogrammare</option>
        <option value="completed" ${a.status==="completed"?"selected":""}>Eseguito</option>
        <option value="cancelled" ${a.status==="cancelled"?"selected":""}>Annullato</option>
      </select></div>
      <div class="field"><label>Note</label><textarea name="notes">${esc(a.notes||"")}</textarea></div>
      <button class="btn primary">Salva modifiche</button>
    </form>`);
  document.querySelector("#ef").onsubmit=async e=>{
    e.preventDefault();
    const x=Object.fromEntries(new FormData(e.currentTarget).entries());
    const t=techs.find(t=>t.id===x.technician_id);
    x.technician_name=t?.full_name||"Antonio";
    x.starts_at=new Date(x.starts_at).toISOString();
    x.ends_at=new Date(x.ends_at).toISOString();
    const {error}=await sb.from("appointments").update(x).eq("id",id);
    if(error) return alert(error.code==="23P01"?"Questo orario è già occupato.":(error.message.includes("TECNICO_NON_DISPONIBILE")?"Antonio risulta non disponibile in questo orario.":error.message));
    await load(); view="agenda"; render();
  };
}

function unavailabilityForm(){
  if(!techs.length) return alert("Nessun tecnico attivo.");
  const st=new Date(); st.setDate(st.getDate()+1); st.setHours(9,0,0,0);
  const en=new Date(st); en.setHours(18,0,0,0);
  shell(`
    <div class="section">Nuova indisponibilità</div>
    <form id="uf" class="card">
      <div class="field"><label>Tecnico</label><select name="technician_id">${techs.map(t=>`<option value="${t.id}">${esc(t.full_name)}</option>`).join("")}</select></div>
      <div class="field"><label>Da</label><input name="starts_at" type="datetime-local" value="${local(st)}" required></div>
      <div class="field"><label>A</label><input name="ends_at" type="datetime-local" value="${local(en)}" required></div>
      <div class="field"><label>Motivo</label><input name="reason" placeholder="Ferie, permesso, impegno..."></div>
      <button class="btn primary">Salva indisponibilità</button>
    </form>`);
  document.querySelector("#uf").onsubmit=async e=>{
    e.preventDefault();
    const x=Object.fromEntries(new FormData(e.currentTarget).entries());
    x.starts_at=new Date(x.starts_at).toISOString();
    x.ends_at=new Date(x.ends_at).toISOString();
    x.created_by=user.id;
    const {error}=await sb.from("technician_unavailability").insert(x);
    if(error) return alert(error.message.includes("APPUNTAMENTO_ESISTENTE")?"C'è già un sopralluogo fissato in questa fascia oraria.":error.message);
    await load(); view="staff"; render();
  };
}

async function deleteUnavailability(id){
  if(!confirm("Eliminare questa indisponibilità?")) return;
  const {error}=await sb.from("technician_unavailability").delete().eq("id",id);
  if(error) return alert(error.message);
  await load(); view="staff"; render();
}

function local(d){
  const z=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;
}

function availabilityHtml(){
  let out="";
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()+i); d.setHours(0,0,0,0);
    let slots=[];
    for(let h=9;h<18;h++){
      const s=new Date(d); s.setHours(h,0,0,0);
      const e=new Date(s.getTime()+3600000);
      const busy=appts.some(a=>a.status!=="cancelled"&&new Date(a.starts_at)<e&&new Date(a.ends_at)>s);
      slots.push(`<span class="slot ${busy?"busy":""}">${String(h).padStart(2,"0")}:00</span>`);
    }
    out+=`<div class="card"><b>${new Intl.DateTimeFormat("it-IT",{weekday:"long",day:"2-digit",month:"2-digit"}).format(d)}</b><div style="margin-top:7px">${slots.join("")}</div></div>`;
  }
  return out;
}

function availability(){
  shell(`<div class="section">Disponibilità prossimi 7 giorni</div>${availabilityHtml()}`);
}

function staff(){
  shell(`
    <div class="section">Tecnici attivi</div>
    ${techs.map(t=>`<div class="card"><div class="name">${esc(t.full_name)}</div><div class="meta">${esc(t.email)}</div></div>`).join("") || '<div class="card">Nessun tecnico attivo.</div>'}
    <div class="row"><button class="btn primary" id="addUn">+ Indisponibilità</button></div>
    <div class="section">Indisponibilità</div>
    ${unavail.filter(u=>new Date(u.ends_at)>=new Date()).map(u=>`<div class="card"><div class="name">🚫 ${fmt(u.starts_at)} → ${fmt(u.ends_at)}</div><div class="meta">${esc(u.reason||"Indisponibile")}</div><div class="row" style="margin-top:8px"><button class="btn bad" data-del-un="${u.id}">Elimina</button></div></div>`).join("") || '<div class="card">Nessuna indisponibilità futura.</div>'}
  `);
  document.querySelector("#addUn").onclick=()=>unavailabilityForm();
  document.querySelectorAll("[data-del-un]").forEach(b=>b.onclick=()=>deleteUnavailability(b.dataset.delUn));
}

start().catch(e=>{
  app.innerHTML=`<div class="login"><div class="msg error">${esc(e.message)}</div></div>`;
});
</script>
