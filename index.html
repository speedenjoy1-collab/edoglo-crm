<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101827" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <title>Edoglò CRM</title>
  <style>
    :root{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#0f172a;background:#f4f7fb;
      --ink:#0f172a;--muted:#64748b;--line:#dbe3ee;--panel:#fff;
      --navy:#0f172a;--blue:#2563eb;--green:#15803d;--amber:#b45309;--red:#b91c1c;
      --shadow:0 8px 30px rgba(15,23,42,.06);
    }
    *{box-sizing:border-box}
    html{background:#f4f7fb}
    body{margin:0;background:linear-gradient(180deg,#eef4fb 0,#f8fafc 220px,#f4f7fb 100%);min-height:100vh}
    button,input,select,textarea{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .wrap{max-width:1080px;margin:auto;padding:18px 18px 104px}
    .role-technician .wrap{max-width:700px}
    .top{
      display:flex;justify-content:space-between;align-items:center;gap:14px;
      position:sticky;top:0;z-index:20;margin:0 -4px 16px;padding:12px 4px 14px;
      background:rgba(244,247,251,.92);backdrop-filter:blur(12px);
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand-mark{
      width:42px;height:42px;border-radius:13px;background:#0f172a;color:#fff;
      display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 7px 18px rgba(15,23,42,.18)
    }
    .brand-copy{min-width:0}
    h1{font-size:22px;line-height:1.1;margin:0;letter-spacing:-.02em}
    .sub{color:var(--muted);font-size:13px;margin-top:3px}
    .role-chip{
      display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 8px;border-radius:999px;
      font-size:10px;font-weight:900;letter-spacing:.08em;background:#e2e8f0;color:#334155
    }
    .role-technician .role-chip{background:#dcfce7;color:#166534}
    .grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr)}
    .card{
      background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:18px;
      padding:16px;margin:11px 0;box-shadow:var(--shadow)
    }
    .stat{min-height:112px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
    .stat:after{content:"";position:absolute;right:-16px;bottom:-22px;width:72px;height:72px;border-radius:50%;background:#f1f5f9}
    .stat b{font-size:30px;line-height:1;display:block;letter-spacing:-.04em;position:relative;z-index:1}
    .stat span{font-size:13px;color:#475569;margin-top:8px;font-weight:700;position:relative;z-index:1}
    .btn{
      border:0;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer;
      background:#e2e8f0;color:#111827;text-decoration:none;display:inline-flex;align-items:center;
      justify-content:center;gap:6px;min-height:42px;transition:transform .12s ease,box-shadow .12s ease
    }
    .btn:active{transform:scale(.98)}
    .primary{background:#0f172a;color:#fff;box-shadow:0 6px 16px rgba(15,23,42,.14)}
    .ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}
    .bad{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1d4ed8}
    .ghost{background:#fff;border:1px solid #cbd5e1}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .field{display:grid;gap:6px;margin:11px 0}
    .field label{font-weight:800;font-size:12px;color:#334155;text-transform:none}
    .field input,.field select,.field textarea,.lead-tools input,.lead-tools select{
      width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px 13px;background:#fff;
      color:#0f172a;outline:none;transition:border-color .12s,box-shadow .12s
    }
    .field input:focus,.field select:focus,.field textarea:focus,.lead-tools input:focus,.lead-tools select:focus{
      border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.16)
    }
    .field textarea{min-height:92px;resize:vertical}
    .tabs{
      display:flex;gap:7px;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);
      border-top:1px solid #dbe3ee;padding:9px max(10px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));
      justify-content:center;z-index:30;box-shadow:0 -10px 30px rgba(15,23,42,.07);backdrop-filter:blur(14px)
    }
    .tab{
      border:0;background:transparent;padding:10px 14px;border-radius:12px;font-weight:800;color:#64748b;
      min-width:84px;cursor:pointer
    }
    .tab.active{background:#0f172a;color:#fff;box-shadow:0 5px 14px rgba(15,23,42,.14)}
    .role-technician .tabs{max-width:700px;margin:auto;border-left:1px solid #dbe3ee;border-right:1px solid #dbe3ee;border-radius:18px 18px 0 0}
    .role-technician .tab{flex:1;max-width:260px;font-size:15px;padding:13px}
    .pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#f1f5f9;font-size:12px;font-weight:800}
    .meta{color:#64748b;font-size:13px;line-height:1.45}
    .name{font-size:18px;font-weight:900;letter-spacing:-.015em}
    .section{font-size:18px;font-weight:900;margin:24px 0 8px;letter-spacing:-.02em}
    .section:first-child{margin-top:8px}
    .login{
      max-width:430px;margin:8vh auto;padding:24px;background:#fff;border:1px solid #dbe3ee;border-radius:22px;
      box-shadow:0 20px 60px rgba(15,23,42,.10)
    }
    .msg{margin:10px 0;padding:10px;border-radius:12px}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
    .notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:13px 14px;border-radius:14px;margin:11px 0;line-height:1.45}
    .appt{border-left:5px solid #c4b5fd;position:relative}
    .today{border-left-color:#22c55e}
    .role-technician .appt{border-left:0;border-top:5px solid #c4b5fd;padding:18px}
    .role-technician .appt.today{border-top-color:#22c55e;background:linear-gradient(180deg,#f0fdf4 0,#fff 90px)}
    .appt-date{
      display:flex;justify-content:space-between;align-items:center;gap:10px;background:#eff6ff;
      border:1px solid #bfdbfe;border-radius:14px;padding:12px 14px;margin:10px 0
    }
    .appt-date-main{font-size:18px;font-weight:950;color:#1e3a8a;text-transform:capitalize}
    .appt-time{font-size:18px;font-weight:950;color:#0f172a;white-space:nowrap}
    .today .appt-date{background:#ecfdf5;border-color:#86efac}
    .today .appt-date-main{color:#166534}
    .today-tag{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;background:#166534;color:#fff;font-size:10px;font-weight:900;vertical-align:middle}
    .role-technician .appt .name{font-size:21px}
    .role-technician .appt .meta{font-size:14px}
    .role-technician .appt .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .role-technician .appt .row .btn{width:100%;min-height:48px;font-size:14px}
    .role-technician .appt .row .btn[data-done]{grid-column:1/-1;background:#166534;color:#fff}
    .slot{display:inline-block;padding:7px 9px;border-radius:9px;margin:3px;background:#dcfce7;font-size:12px;font-weight:700}
    .slot.busy{background:#f1f5f9;color:#94a3b8;text-decoration:line-through}
    .lead-tools{display:grid;grid-template-columns:1fr 190px;gap:9px;margin:12px 0}
    .callback-due{border-left:5px solid #f59e0b}
    .callback-badge{display:inline-block;background:#fef3c7;color:#92400e;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;margin-top:8px}
    .appt-status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;margin:5px 0 8px;letter-spacing:.02em}
    .appt-status.confirmed,.appt-status.scheduled{background:#dbeafe;color:#1d4ed8}
    .appt-status.completed{background:#dcfce7;color:#166534}
    .appt-status.cancelled{background:#fee2e2;color:#991b1b}
    .appt-status.reschedule{background:#fef3c7;color:#92400e}
    .outcome-box{margin-top:10px;padding:11px 13px;border-radius:13px;background:#f8fafc;border:1px solid #cbd5e1;line-height:1.45}
    .outcome-box b{display:block;margin-bottom:4px;color:#334155}
    .measure-card{background:#fff;border:1px solid #cbd5e1;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 14px rgba(15,23,42,.04)}
    .measure-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .measure-value{font-size:20px;font-weight:950;letter-spacing:-.02em;margin:4px 0}
    .session-card{border:2px solid #e2e8f0}
    .session-card.reference{border-color:#22c55e;background:#f0fdf4}
    .session-badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;margin:5px 5px 5px 0;letter-spacing:.04em}
    .session-badge.preliminary{background:#e0f2fe;color:#075985}
    .session-badge.definitive{background:#ede9fe;color:#5b21b6}
    .session-badge.reference{background:#166534;color:#fff}
    .agenda-filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}
    .agenda-filter{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}
    .agenda-filter.active{background:#0f172a;color:#fff;border-color:#0f172a}
    .role-technician .section{font-size:19px}
    .role-technician form.card{padding:17px}
    .role-technician form.card>.primary{width:100%;min-height:48px}
    .role-technician .measure-card .row .btn{flex:1}
    .role-technician #saveSurvey{width:100%;min-height:50px;background:#166534;color:#fff}
    .survey-step{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
    .survey-step-title{font-size:12px;font-weight:900;color:#64748b;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
    .product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .product-btn{border:1px solid #cbd5e1;background:#fff;border-radius:14px;padding:14px 10px;font-weight:900;min-height:58px;cursor:pointer;color:#0f172a}
    .product-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}
    .survey-current{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:15px;padding:12px 14px;margin:10px 0}
    .position-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .position-number{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#0f172a;color:#fff;font-size:18px;font-weight:950}
    @media(max-width:640px){
      body{font-size:17px}
      .wrap{padding:12px 10px 108px}
      .top{padding-top:8px;margin-bottom:12px}
      .brand-mark{width:42px;height:42px;border-radius:12px;font-size:19px}
      h1{font-size:22px}
      .sub{font-size:14px}
      .role-chip{font-size:11px;padding:5px 9px}
      .stats{gap:9px}
      .stat{min-height:106px;padding:15px}
      .stat b{font-size:30px}
      .stat span{font-size:14px}
      .card{border-radius:16px;padding:16px}
      .name{font-size:20px}
      .meta{font-size:15px}
      .section{font-size:19px;margin-top:22px}
      .btn{font-size:15px;min-height:48px;padding:12px 14px}
      .field{gap:7px;margin:12px 0}
      .field label{font-size:14px}
      .field input,.field select,.field textarea,.lead-tools input,.lead-tools select{
        font-size:17px;padding:14px 13px;border-radius:13px;min-height:50px
      }
      .field textarea{min-height:108px}
      .appt-date{align-items:flex-start;flex-direction:column;padding:14px}
      .appt-date-main{font-size:20px}
      .appt-time{font-size:20px}
      .appt-status{font-size:12px;padding:6px 10px}
      .today-tag{font-size:11px;padding:4px 8px}
      .lead-tools{grid-template-columns:1fr}
      .measure-grid{grid-template-columns:1fr}
      .measure-card{padding:16px}
      .measure-value{font-size:22px}
      .survey-step{padding:17px}
      .survey-step-title{font-size:13px}
      .survey-current{padding:14px}
      .product-btn{font-size:15px;min-height:64px;padding:14px 9px}
      .position-number{width:48px;height:48px;font-size:20px}
      .tabs{justify-content:stretch;padding-top:10px}
      .tab{flex:1;min-width:0;padding:12px 8px;font-size:14px;min-height:48px}
      .top>.btn{padding:10px 12px;min-height:42px;font-size:14px}
      .role-technician .appt{padding:18px}
      .role-technician .appt .name{font-size:22px}
      .role-technician .appt .meta{font-size:15px}
      .role-technician .appt .row .btn{min-height:52px;font-size:16px}
      .role-technician form.card>.primary,
      .role-technician #saveSurvey{min-height:54px;font-size:16px}
    }
    @media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
  </style>
<style>

.lead-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}

</style>
<style>
.callback-panel{border:1px solid #eab308;border-radius:14px;padding:15px;margin:15px 0;background:rgba(234,179,8,.07)}
.callback-form{display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:10px;margin-top:12px}

</style><style>
.social-channels{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}

<style>
.dashboard-intro{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(120deg,#162641,#244879);border-radius:22px;color:#fff;padding:25px;margin:10px 0 18px}
.dashboard-intro h2{font-size:clamp(23px,3vw,32px);margin:6px 0;letter-spacing:-.035em}

<body>
<div id="app"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const sb=createClient(
  "https://erapqwuizpdccnrtzwns.supabase.co",
  "sb_publishable_6wz50wCBm44-DufMKB2dAQ_tmcflhkw",
  {auth:{persistSession:true}}
);

const app=document.querySelector("#app");
let user=null, profile=null, leads=[], appts=[], techs=[], unavail=[], view="home";
const surveyStateBySession={};
let weekMonday=null,weekSearch="";

const esc=v=>String(v??"").replace(/[&<>'"]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[s]));
const digits=v=>String(v||"").replace(/[^0-9]/g,"");
const waNumber=v=>{
  let d=digits(v);
  if(d.startsWith("00")) d=d.slice(2);
  if(d.startsWith("39")) return d;
  if(d.startsWith("3") && d.length>=9) return "39"+d;
  return d;
};
const fmt=x=>new Intl.DateTimeFormat("it-IT",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"}).format(new Date(x));
const fmtDate=x=>new Intl.DateTimeFormat("it-IT",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric",timeZone:"Europe/Rome"}).format(new Date(x));
const fmtTime=x=>new Intl.DateTimeFormat("it-IT",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"}).format(new Date(x));
const day=x=>new Intl.DateTimeFormat("sv-SE",{year:"numeric",month:"2-digit",day:"2-digit",timeZone:"Europe/Rome"}).format(new Date(x));
const now=()=>new Date().toISOString();

const apptLabel={scheduled:"Programmato",confirmed:"Confermato",completed:"Eseguito",cancelled:"Annullato",reschedule:"Da riprogrammare"};

const label={
  new:"Nuovo",
  valid:"Valido",
  bot:"Bot/Falso",
  out_of_area:"Fuori zona",
  no_answer:"Non risponde",
  callback:"Da richiamare",
  not_interested:"Non interessato",
  appointment:"Sopralluogo fissato",
  won:"Acquisito",
  lost:"Perso"
};

async function start(){
  const {data:{user:u}}=await sb.auth.getUser();
  user=u;
  if(!user){ login(); return; }
  const {data:p}=await sb.from("staff_profiles").select("*").eq("id",user.id).maybeSingle();
  if(!p){ unauthorized(); return; }
  profile=p;
  await load();
  render();
}

function login(){
  app.innerHTML=`
  <div class="login">
    <h1>Edoglò CRM</h1>
    <p class="sub">Accesso riservato</p>
    <div id="m"></div>
    <div class="field"><label>Email</label><input id="email" type="email"></div>
    <div class="field"><label>Password</label><input id="pw" type="password" minlength="8"></div>
    <div class="row">
      <button class="btn primary" id="go">Accedi</button>
      <button class="btn ghost" id="signup">Primo accesso</button>
    </div>
    <div class="notice">Il primo account creato nel CRM diventa amministratore. Crealo tu prima dell'accesso di Antonio.</div>
  </div>`;

  const emailEl=document.querySelector("#email");
  const pwEl=document.querySelector("#pw");
  const msgEl=document.querySelector("#m");
  document.querySelector("#go").onclick=async()=>{
    const {error}=await sb.auth.signInWithPassword({email:emailEl.value.trim(),password:pwEl.value});
    msgEl.innerHTML=error?`<div class="msg error">${esc(error.message)}</div>`:`<div class="msg success">Accesso eseguito</div>`;
    if(!error) location.reload();
  };

  document.querySelector("#signup").onclick=async()=>{
    if(!emailEl.value || pwEl.value.length<8){
      msgEl.innerHTML='<div class="msg error">Inserisci email e password di almeno 8 caratteri.</div>';
      return;
    }
    const {error}=await sb.auth.signUp({
      email:emailEl.value.trim(),
      password:pwEl.value,
      options:{data:{full_name:emailEl.value.split("@")[0]},emailRedirectTo:"https://edoglo-crm.onrender.com"}
    });
    msgEl.innerHTML=error?`<div class="msg error">${esc(error.message)}</div>`:`<div class="msg success">Account creato. Se ricevi una mail, confermala e poi accedi.</div>`;
  };
}

function unauthorized(){
  app.innerHTML=`
  <div class="login">
    <h1>Edoglò CRM</h1>
    <div class="notice">Account creato ma non ancora autorizzato nel CRM.</div>
    <button class="btn ghost" id="out">Esci</button>
  </div>`;
  document.querySelector("#out").onclick=async()=>{await sb.auth.signOut();location.reload();};
}

async function load(){
  const [l,a,u]=await Promise.all([
    sb.from("leads").select("*").order("created_at",{ascending:false}),
    sb.from("appointments").select("*").order("starts_at",{ascending:true}),
    sb.from("technician_unavailability").select("*").order("starts_at",{ascending:true})
  ]);
  if(l.error)throw l.error;
  if(a.error)throw a.error;
  if(u.error)throw new Error("Errore caricamento indisponibilità: "+u.error.message);
  leads=l.data||[];appts=a.data||[];unavail=u.data||[];
  if(profile.role==="admin"){
    const t=await sb.from("staff_profiles").select("id,full_name,email,role,active").eq("role","technician").eq("active",true).order("full_name");
    if(t.error)throw t.error;
    techs=t.data||[];
  }
}

function nav(){
 if(profile.role!=="admin"){
   const items=[["agenda","Oggi"],["availability","Agenda"]];
   return '<nav class="tabs" aria-label="Navigazione tecnico">'+items.map(([v,n])=>'<button class="tab '+(view===v?"active":"")+'" data-v="'+v+'">'+n+'</button>').join("")+'</nav>';
 }
 const items=[
   ["home","Lead","◉"],
   ["quotes","Preventivi","▤"],
   ["agenda","Agenda","▦"],
   ["leads","Clienti","☷"],
   ["social","Campagne","◎"],
   ["staff","Tecnici","⚙"]
 ];
 const tab=([v,label,icon])=>`<button type="button" class="tab tab-${v} ${view===v?"active":""}" data-v="${v}" ${view===v?'aria-current="page"':""}><span class="tab-icon" aria-hidden="true">${icon}</span><span>${label}</span></button>`;
 return `<nav class="tabs admin-nav" aria-label="Navigazione CRM">
   <div class="nav-brand"><span class="nav-logo">E</span><span>EDOGLÒ<small>GESTIONALE</small></span></div>
   ${items.slice(0,4).map(tab).join("")}
   <div class="crm-nav-divider">STRUMENTI</div>
   ${items.slice(4).map(tab).join("")}
   <button type="button" class="tab tab-more ${["social","staff"].includes(view)?"active":""}" id="navMore" aria-expanded="false" aria-controls="navExtra"><span class="tab-icon" aria-hidden="true">⋯</span><span>Altro</span></button>
   <div class="nav-extra" id="navExtra" hidden><button type="button" data-v="social">◎ Campagne</button><button type="button" data-v="staff">⚙ Tecnici</button></div>
 </nav>`;
}

function shell(body){
  document.body.className=profile.role==="technician"?"role-technician":"role-admin";
  const displayName=profile.full_name||profile.email||"";
  app.innerHTML=`
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="brand-mark">E</div>
        <div class="brand-copy">
          <h1>Edoglò CRM${profile.role==="admin"?'<span class="crm-build-indicator">v34</span>':""}</h1>
          <div class="sub">${profile.role==="admin"?"Gestione commerciale e sopralluoghi":"Agenda e rilievi tecnici"}</div>
          <div class="role-chip">${profile.role==="admin"?"ADMIN":"TECNICO"}${displayName?" · "+esc(displayName):""}</div>
        </div>
      </div>
      <div class="header-actions">${profile.role==="admin"?'<button type="button" class="btn primary crm-add-btn" id="quickAddClient">+ Cliente</button>':""}
 <details class="crm-header-actions"><summary aria-label="Impostazioni CRM">⋯</summary><div class="crm-header-popup"><button class="btn ghost" id="themeToggle" type="button">◐ Tema</button><button class="btn ghost" id="refreshCrm" type="button">↻ Aggiorna CRM</button><button class="btn ghost" id="logout">Esci</button></div></details>
 </div>
    </div>
    ${body}
  </div>
  ${nav()}`;
  document.querySelector("#themeToggle").onclick=()=>{const dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"light";localStorage.setItem("edoglo-theme",dark?"dark":"light");};
  document.querySelector("#logout").onclick=async()=>{await sb.auth.signOut();location.reload();};
  document.querySelector("#refreshCrm").onclick=()=>location.assign(location.pathname+"?__crm_force_refresh="+Date.now());
  const quickAdd=document.querySelector("#quickAddClient");if(quickAdd)quickAdd.onclick=()=>leadForm();
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});
  const more=document.querySelector("#navMore");if(more)more.onclick=()=>{const box=document.querySelector("#navExtra");box.hidden=!box.hidden;more.setAttribute("aria-expanded",String(!box.hidden));};

}

function render(){
  if(profile.role==="technician" && view==="home") view="agenda";
  ({home,social:socialView,leads:leadsView,quotes:quotesView,agenda,availability,staff}[view]||home)();
}

const quoteLabel={not_required:"Non richiesto",to_prepare:"Preventivo da fare",sent:"Preventivo inviato",accepted:"Accettato",declined:"Non accettato"};
const originLabel={digital:"Lead online",manual:"Inserito manualmente",technician:"Inserito dal tecnico"};
function quoteCard(l){
 const a=appts.find(x=>x.lead_id===l.id);
 let actions=`<button type="button" class="btn ghost" data-open="${esc(l.id)}">Apri cliente</button>`;
 if(a)actions+=`<button type="button" class="btn blue" data-quote-detail="${esc(l.id)}">Apri rilievo</button>`;
 if(l.quote_status==="to_prepare")actions+=`<button type="button" class="btn ok" data-quote-sent="${esc(l.id)}">Segna inviato</button>`;
 if(l.quote_status==="sent")actions+=`<button type="button" class="btn ok" data-quote-accepted="${esc(l.id)}">Accettato</button><button type="button" class="btn ghost" data-quote-declined="${esc(l.id)}">Non accettato</button>`;
 return `<article class="crm-quote-row"><div><strong>${esc(l.full_name||"Cliente")}</strong><small>${esc([l.city,l.province].filter(Boolean).join(" · ")||"Comune da verificare")} · ${esc(l.request||l.request_summary||"Richiesta da verificare").slice(0,80)}</small></div><div class="crm-quote-actions">${actions}</div></article>`;
}

function quoteCards(xs){ return xs.length?xs.map(quoteCard).join(""):"<div class=\"card\">Nessun cliente in questa sezione.</div>"; }
async function setQuoteStatus(id,status){
  const patch={quote_status:status,updated_at:now()};
  if(status==="sent") patch.quote_sent_at=now();
  const {error}=await sb.from("leads").update(patch).eq("id",id);
  if(error) return alert(error.message);
  await load(); view="quotes"; render();
}
function bindQuoteActions(){
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>leadDetail(b.dataset.open));
  document.querySelectorAll("[data-quote-detail]").forEach(b=>b.onclick=()=>quoteDetail(b.dataset.quoteDetail));
  document.querySelectorAll("[data-quote-sent]").forEach(b=>b.onclick=()=>setQuoteStatus(b.dataset.quoteSent,"sent"));
  document.querySelectorAll("[data-quote-accepted]").forEach(b=>b.onclick=()=>setQuoteStatus(b.dataset.quoteAccepted,"accepted"));
  document.querySelectorAll("[data-quote-declined]").forEach(b=>b.onclick=()=>setQuoteStatus(b.dataset.quoteDeclined,"declined"));
}
function measurementSummaryCard(r,i){
  const lines=[];
  if(r.opening_type) lines.push("<b>Tipologia:</b> "+esc(r.opening_type));
  if(r.profile) lines.push("<b>Profilo:</b> "+esc(r.profile));
  if(r.product_color||r.frame_color) lines.push("<b>Colore:</b> "+esc(r.product_color||r.frame_color));
  if(r.glass_spec) lines.push("<b>Vetro:</b> "+esc(r.glass_spec));
  if(r.handle_color) lines.push("<b>Maniglia:</b> "+esc(r.handle_color));
  if(r.opening_direction) lines.push("<b>Apertura:</b> "+esc(r.opening_direction));
  if(r.roller_shutter) lines.push("<b>Tapparella:</b> "+esc(r.roller_shutter));
  if(r.roller_shutter_control) lines.push("<b>Comando:</b> "+esc(r.roller_shutter_control));
  if(r.roller_shutter_color) lines.push("<b>Colore tapparella:</b> "+esc(r.roller_shutter_color));
  if(r.mosquito_net) lines.push("<b>Zanzariera:</b> "+esc(r.mosquito_net));
  if(r.persiana) lines.push("<b>Persiana:</b> "+esc(r.persiana));
  if(r.cassonetto) lines.push("<b>Cassonetto:</b> "+esc(r.cassonetto));
  if(r.monoblocco) lines.push("<b>Monoblocco:</b> "+esc(r.monoblocco));
  if(r.product_detail) lines.push("<b>Dettaglio:</b> "+esc(r.product_detail));
  if(r.sill) lines.push("<b>Soglia:</b> "+esc(r.sill));

function callbackGroup(l){
 if(!l.callback_at)return "unscheduled";
 const d=new Date(l.callback_at),n=new Date(),midnight=new Date(n.getFullYear(),n.getMonth(),n.getDate()),tomorrow=new Date(midnight.getTime()+86400000);
 return d<n?"overdue":d<tomorrow?"today":"future";
}
function callbackTimeHtml(l){
 if(l.status!=="callback")return "";
 const g=callbackGroup(l),d=l.callback_at?new Date(l.callback_at):null;
 return '<div class="callback-time '+(g==="overdue"||g==="unscheduled"?"overdue":"upcoming")+'">'+(g==="overdue"?"Richiamo in ritardo: ":g==="unscheduled"?"Orario da impostare: ":"Richiamare: ")+(d?esc(d.toLocaleString("it-IT",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})):"non programmato")+'</div>';
}
function callbackBoard(){

function callbackEditor(l){

}

function nextFreeTechnicianSlot(){
  let start=new Date();
  start.setSeconds(0,0);
  let end=new Date(start.getTime()+30*60000);
  const own=appts
    .filter(a=>a.technician_id===user.id && a.status!=="cancelled")
    .sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
  let moved=true;
  while(moved){
    moved=false;
    for(const a of own){
      const as=new Date(a.starts_at), ae=new Date(a.ends_at);
      if(start<ae && end>as){
        start=new Date(ae);
        end=new Date(start.getTime()+30*60000);
        moved=true;
        break;
      }
    }
  }
  return {start,end};
}

  shell(`

      <div class="field"><label>Indirizzo</label><input name="address" required></div>
      <div class="field"><label>Comune *</label><input name="city" required placeholder="Es. Tradate"></div>
      <div class="field"><label>Provincia</label><input name="province" maxlength="2"></div>

      <button class="btn primary">Crea cliente e inserisci misure</button>
    </form>
  `);

  document.querySelector("#techClientForm").onsubmit=async e=>{
    e.preventDefault();
    const x=Object.fromEntries(new FormData(e.currentTarget).entries());
    const leadPayload={
      source:"Passaparola",
      origin_type:"technician",
      status:"appointment",
      full_name:x.full_name.trim(),
      phone:x.phone.trim(),
      email:x.email?.trim()||null,
      address:x.address.trim(),
      city:x.city?.trim()||null,
      province:x.province?.trim().toUpperCase()||null,
      request:x.request?.trim()||null,
      assigned_to:user.id,
      created_by:user.id
    };
    const {data:lead,error:leadErr}=await sb.from("leads").insert(leadPayload).select("id").single();
    if(leadErr) return alert(leadErr.message);

    const slot=nextFreeTechnicianSlot();
    const apptPayload={
      lead_id:lead.id,
      technician_id:user.id,
      starts_at:slot.start.toISOString(),
      ends_at:slot.end.toISOString(),
      status:"confirmed",
      address:leadPayload.address,
      city:leadPayload.city,
      province:leadPayload.province,
      client_name:leadPayload.full_name,
      phone:leadPayload.phone,
      technician_name:profile.full_name||"Antonio",
      notes:leadPayload.request,
      source:"Nuovo cliente tecnico",
      activity_type:"Rilievo misure",
      created_by:user.id
    };
    // Un rilievo nuovo non deve essere bloccato da impegni gia presenti.
    // La scheda misure richiede un appuntamento tecnico collegato; cerchiamo uno slot libero.
    let appt=null,apptErr=null;
    for(let attempt=0;attempt<90;attempt++){
      const start=new Date(slot.start.getTime()+attempt*30*60000);
      const end=new Date(start.getTime()+30*60000);
      apptPayload.starts_at=start.toISOString();
      apptPayload.ends_at=end.toISOString();
      const result=await sb.from("appointments").insert(apptPayload).select("id").single();
      if(!result.error){appt=result.data;apptErr=null;break;}
      apptErr=result.error;
      if(result.error.code!=="23P01") break;
    }
    if(apptErr){
      await sb.from("leads").update({status:"new"}).eq("id",lead.id);
      return alert(apptErr.code==="23P01"?"Cliente creato, ma non ho potuto generare automaticamente il sopralluogo per un conflitto di orario.":"Cliente creato, ma il sopralluogo non è stato generato: "+apptErr.message);
    }
    await load();
    measurementsView(appt.id);
  };
}

let agendaMode="month",agendaFocus=new Date(),agendaSelected=day(new Date()),agendaTechId="";
const calendarStart=(d)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const dateFromKey=k=>new Date(k+"T12:00:00");
const calendarKey=d=>day(d);
const sameMonth=(d,m)=>d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear();
const startOfDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
function techBusyIntervals(techId,ignoreId=null){
 const appointments=appts.filter(a=>a.technician_id===techId&&a.id!==ignoreId&&["confirmed","scheduled"].includes(a.status))
   .map(a=>({start:new Date(a.starts_at),end:new Date(a.ends_at),kind:"appointment",label:a.client_name||"Appuntamento"}));
 const absences=unavail.filter(a=>a.technician_id===techId)
   .map(a=>({start:new Date(a.starts_at),end:new Date(a.ends_at),kind:"absence",label:a.reason||"Indisponibile"}));
 return [...appointments,...absences].filter(a=>!Number.isNaN(a.start.getTime())&&!Number.isNaN(a.end.getTime()));
}
function dayOccupancy(date,techId,minutes=60,ignoreId=null){
 const dayStart=startOfDay(date),dayEnd=new Date(date.getFullYear(),date.getMonth(),date.getDate()+1);
 const intervals=techBusyIntervals(techId,ignoreId).filter(a=>a.start<dayEnd&&a.end>dayStart);
 const slots=[];
 for(let hour=9;hour<18;hour++)for(const minute of [0,30]){
   const start=new Date(date.getFullYear(),date.getMonth(),date.getDate(),hour,minute,0,0);
   const end=new Date(start.getTime()+minutes*60000);
   const businessEnd=new Date(date.getFullYear(),date.getMonth(),date.getDate(),18,0,0,0);
   if(end>businessEnd)continue;
   const clash=intervals.some(a=>start<a.end&&end>a.start);
   if(!clash)slots.push(start);
 }
 const absence=intervals.some(a=>a.kind==="absence");
 const events=intervals.filter(a=>a.kind==="appointment").length;
 const state=absence?"blocked":slots.length===0?"full":events?"busy":"free";
 return {slots,state,events,absence};
}
function crmCalendarMonthGrid(month,techId,minutes=60,ignoreId=null,onDate="calendar-pick",selected=""){

 const days=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
 const labels=["L","M","M","G","V","S","D"];
 return '<div class="crm-calendar-grid" role="group" aria-label="Calendario disponibilità">'+
 labels.map(w=>'<div class="crm-calendar-weekday">'+w+'</div>').join("")+
 days.map(d=>{
   const k=calendarKey(d),availability=dayOccupancy(d,techId,minutes,ignoreId);
   const active=selected===k,outside=!sameMonth(d,month);
   const short=availability.state==="free"?"Libero":availability.state==="busy"?"Impegni":availability.state==="blocked"?"Assenza":"Pieno";
   return '<button type="button" class="crm-calendar-day state-'+availability.state+(active?" picked":"")+(outside?" outside":"")+'" data-'+onDate+'="'+k+'" aria-pressed="'+active+'" title="'+k+' · '+short+'"><strong>'+d.getDate()+'</strong><span>'+short+'</span></button>';
 }).join("")+'</div>';
}

 (active?'<div class="crm-week-grid">'+days.map(cell).join("")+'</div>':monthGrid)+

function validateVisitSlot(techId,start,type,ignoreId=null,minutesOverride=null){
 const end=new Date(start.getTime()+(minutesOverride||visitDurationMinutes(type))*60000);
 if(!techId||Number.isNaN(start.getTime()))return "Tecnico e data sono obbligatori.";
 const dayEnd=new Date(start.getFullYear(),start.getMonth(),start.getDate(),18,0);
 const dayStart=new Date(start.getFullYear(),start.getMonth(),start.getDate(),9,0);
 if(start<dayStart||end>dayEnd)return "Scegli un orario compreso tra le 09:00 e le 18:00, considerando la durata prevista.";
 const conflict=techBusyIntervals(techId,ignoreId).find(a=>start<a.end&&end>a.start);
 if(conflict)return conflict.kind==="absence"?"Tecnico indisponibile in questa fascia. Scegli una data libera.":"Orario già occupato da un altro appuntamento.";
 return "";
}


function crmInstallationPlanner(form){
 const option=form.querySelector("#crmMultiDayOption");
 const check=form.querySelector("#visitMultiDay");
 const holder=form.querySelector("#crmMultiInstallPlanner");
 const mainStart=form.querySelector("#visitStart");
 const singlePlanner=form.querySelector("#crmBookingCalendar");
 const tech=form.querySelector('[name="technician_id"]');
 const type=form.querySelector('[name="activity_type"]');
 const selectedDays=new Set();
 let month=mainStart?.value?dateFromKey(mainStart.value.slice(0,10)):new Date();
 let startHour="09:00";
 const enabled=()=>Boolean(check.checked&&type.value==="Installazione");
 form.getInstallationDates=()=>({enabled:enabled(),dates:Array.from(selectedDays).sort(),time:startHour});
 const candidate=(key)=>{
   const d=dateFromKey(key),[hh,mm]=startHour.split(":").map(Number);
   const start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mm,0,0);
   const end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),18,0,0,0);
   const today=startOfDay(new Date());
   if(d<today)return {valid:false,kind:"past",message:"Data passata"};
   if(hh<9||start>=end)return {valid:false,kind:"hours",message:"Orario non valido"};
   const conflict=techBusyIntervals(tech.value).find(a=>start<a.end&&end>a.start);
   if(conflict)return {valid:false,kind:conflict.kind,message:conflict.kind==="absence"?"Indisponibile":"Impegno presente"};
   return {valid:true,kind:"free",message:"Libero"};
 };
 const draw=()=>{
   if(!enabled())return;
   const first=new Date(month.getFullYear(),month.getMonth(),1,12),gridStart=calendarStart(first);
   const days=Array.from({length:42},(_,i)=>{const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);return d});
   const labels=["L","M","M","G","V","S","D"];
   const dates=Array.from(selectedDays).sort();
   const cells=days.map(d=>{
     const key=calendarKey(d),test=candidate(key),picked=selectedDays.has(key),outside=!sameMonth(d,month);
     const klass=picked?"picked":test.valid?"state-free":test.kind==="absence"?"state-blocked":"state-full";
     return '<button type="button" class="crm-calendar-day crm-multi-day '+klass+(outside?" outside":"")+'" data-install-date="'+key+'" aria-pressed="'+picked+'" title="'+key+' · '+test.message+'" '+(!test.valid&&!picked?'disabled':'')+'><strong>'+d.getDate()+'</strong><span>'+(picked?"Scelto":test.valid?"Libero":test.kind==="absence"?"Assenza":"Occupato")+'</span></button>';
   }).join("");
   const chosen=dates.length?dates.map(key=>{
     const test=candidate(key);
     return '<button type="button" class="crm-install-chip'+(test.valid?"":" invalid")+'" data-remove-install="'+key+'">'+esc(new Intl.DateTimeFormat("it-IT",{day:"numeric",month:"short",year:"numeric"}).format(dateFromKey(key)))+(test.valid?"":" · occupato")+' ×</button>';
   }).join(""):'<span class="crm-install-empty">Seleziona le giornate dal calendario, anche non consecutive.</span>';
   holder.innerHTML='<div class="crm-install-heading"><strong>Giornate riservate a questo cliente</strong><p>Seleziona tutti i giorni necessari, anche separati: ad esempio 21, 23 e 24 novembre. I giorni intermedi non verranno bloccati.</p></div>'+
      '<div class="crm-install-start"><label for="crmInstallStartHour">Ora di inizio per ogni giornata</label><input id="crmInstallStartHour" type="time" min="09:00" max="17:30" step="1800" value="'+startHour+'"><small>Il CRM riserverà la giornata fino alle 18:00. L’orario di fine non va inserito.</small></div>'+
      '<div class="crm-planner-header"><button type="button" id="installPrev" aria-label="Mese precedente">‹</button><strong>'+esc(new Intl.DateTimeFormat("it-IT",{month:"long",year:"numeric"}).format(month))+'</strong><button type="button" id="installNext" aria-label="Mese successivo">›</button></div>'+
      '<div class="crm-calendar-grid" role="group" aria-label="Giornate per la posa">'+labels.map(l=>'<div class="crm-calendar-weekday">'+l+'</div>').join("")+cells+'</div>'+
      '<div class="crm-install-selected"><strong>'+dates.length+' giornate selezionate</strong><div class="crm-install-chips">'+chosen+'</div></div>';
   holder.querySelector("#installPrev").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1,12);draw()};
   holder.querySelector("#installNext").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1,12);draw()};

   holder.querySelectorAll("[data-install-date]").forEach(btn=>btn.onclick=()=>{
     const key=btn.dataset.installDate;
     if(selectedDays.has(key))selectedDays.delete(key);

     draw();
   });
   holder.querySelectorAll("[data-remove-install]").forEach(btn=>btn.onclick=()=>{selectedDays.delete(btn.dataset.removeInstall);draw()});

function installationAppointmentRows(form,base,notes){
 const schedule=form.getInstallationDates?.();
 if(!schedule?.enabled)return {rows:null,error:null};
 if(schedule.dates.length<2)return {rows:null,error:"Seleziona almeno due giornate per la posa, anche non consecutive."};
 const [hh,mm]=schedule.time.split(":").map(Number);
 if(!Number.isInteger(hh)||!Number.isInteger(mm)||hh<9||hh>17||mm<0||mm>59)return {rows:null,error:"Inserisci un orario di inizio valido."};
 const groupId="posa-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
 const count=schedule.dates.length;
 const rows=[];
 for(const [i,key]of schedule.dates.entries()){
   const d=dateFromKey(key);
   if(calendarKey(d)!==key)return {rows:null,error:"Una delle date selezionate non è valida."};
   if(d<startOfDay(new Date()))return {rows:null,error:"Non è possibile programmare un giorno già trascorso."};
   const start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mm,0,0);
   const end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),18,0,0,0);
   if(start>=end)return {rows:null,error:"L’ora di inizio deve precedere le 18:00."};
   const conflict=validateVisitSlot(base.technician_id,start,"Installazione",null,Math.round((end-start)/60000));
   if(conflict)return {rows:null,error:key+": "+conflict};
   const prefix="POSA · Giornata "+(i+1)+" di "+count+" ("+schedule.dates.map(k=>new Intl.DateTimeFormat("it-IT",{day:"numeric",month:"short"}).format(dateFromKey(k))).join(", ")+")";
   const detailedNotes=prefix+"\n"+notes;
   rows.push({...base,starts_at:start.toISOString(),ends_at:end.toISOString(),notes_for_technician:detailedNotes,notes:detailedNotes,source:"Cliente esistente · Posa su più giornate · "+groupId});
 }
 return {rows,error:null};
}

function local(d){
  const z=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;
}

function minutesLabel(ms){
  const m=Math.max(0,Math.round(ms/60000));
  const h=Math.floor(m/60), mm=m%60;
  return h?(h+"h"+(mm?" "+mm+"m":"")):(m+" min");
}

function freeRangesForDay(d,items,techId=null){
  const start=new Date(d);start.setHours(9,0,0,0);
  const end=new Date(d);end.setHours(18,0,0,0);
  const booked=items.filter(a=>a.status!=="cancelled"&&(!techId||a.technician_id===techId)).map(a=>({s:new Date(a.starts_at),e:new Date(a.ends_at)}));
  const absent=unavail.filter(u=>!techId||u.technician_id===techId).map(u=>({s:new Date(u.starts_at),e:new Date(u.ends_at)}));
  const sorted=[...booked,...absent].filter(x=>x.e>start&&x.s<end).sort((a,b)=>a.s-b.s);
  const out=[];let cursor=start;
  for(const x of sorted){const xs=x.s<start?start:x.s,xe=x.e>end?end:x.e;if(xs>cursor)out.push([new Date(cursor),new Date(xs)]);if(xe>cursor)cursor=xe;}
  if(cursor<end)out.push([new Date(cursor),new Date(end)]);
  return out.filter(([a,b])=>b-a>=30*60000);
}

 const today=new Date();today.setHours(0,0,0,0);
 const dayList=Array.from({length:days},(_,i)=>{const d=new Date(today);d.setDate(today.getDate()+i);const key=day(d);const items=appts.filter(a=>day(a.starts_at)===key&&a.status!=="cancelled").sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));return {date:d,key,items,offset:i};});
 const total=dayList.reduce((n,x)=>n+x.items.length,0);
 const next=dayList.find(x=>x.items.length>0);
 const head=`<div class="crm-agenda-summary"><span><strong>${total}</strong> ${total===1?"appuntamento":"appuntamenti"} nei prossimi ${days} giorni</span><span class="crm-agenda-summary-note">${next?"Prossimo: "+new Intl.DateTimeFormat("it-IT",{weekday:"short",day:"2-digit",month:"short",timeZone:"Europe/Rome"}).format(next.date):"Nessun appuntamento previsto"}</span></div>`;
 const rows=dayList.map(({date:d,key,items,offset:i})=>{
   const dayText=new Intl.DateTimeFormat("it-IT",{weekday:"long",day:"numeric",month:"long",timeZone:"Europe/Rome"}).format(d);
   const dateText=new Intl.DateTimeFormat("it-IT",{day:"2-digit",month:"2-digit",timeZone:"Europe/Rome"}).format(d);
   const dayName=new Intl.DateTimeFormat("it-IT",{weekday:"short",timeZone:"Europe/Rome"}).format(d);
   const absences=unavail.filter(u=>new Date(u.starts_at)<new Date(d.getTime()+86400000)&&new Date(u.ends_at)>d);
   const frees=freeRangesForDay(d,items);
   const absencesHtml=absences.map(u=>`<div class="crm-absence-inline"><strong>⛔ ${esc(techs.find(t=>t.id===u.technician_id)?.full_name||"Tecnico")} indisponibile</strong><span>${fmtTime(u.starts_at)}–${fmtTime(u.ends_at)} · ${esc(u.reason||"Assenza")}</span></div>`).join("");
   const availability=`<details class="crm-availability"><summary>Disponibilità ${frees.length?"· "+frees.length+" fasce":"· nessuna fascia libera"}</summary><div class="crm-free-slots">${frees.length?frees.map(([a,b])=>`<span class="crm-slot">${fmtTime(a)}–${fmtTime(b)}</span>`).join(""):'<span class="crm-muted-slot">Nessuna fascia libera di almeno 30 minuti.</span>'}</div></details>`;
   if(!items.length){
     return `<section class="crm-agenda-day crm-agenda-empty"><div class="crm-agenda-date"><span class="crm-agenda-date-tile"><small>${esc(dayName)}</small><strong>${dateText.slice(0,2)}</strong></span><div><h3>${esc(dayText)} ${i===0?'<span class="crm-today-chip">OGGI</span>':""}</h3><p>Libero · nessun appuntamento</p></div></div>${absencesHtml}${availability}</section>`;
   }
   const events=items.map(a=>{
     const start=new Date(a.starts_at),end=new Date(a.ends_at);
     const duration=Math.round((end-start)/60000);
     const invalidDuration=!Number.isFinite(duration)||duration<=0||duration>12*60;
     const info=String(a.notes_for_technician||a.notes||"");
     const address=[a.address,a.city,a.province].filter(Boolean).join(", ");
     const status=esc(apptLabel[a.status]||a.status||"Confermato");
     const mapHref="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(address);
     return `<article class="crm-agenda-event">
        <div class="crm-agenda-event-time"><strong>${fmtTime(a.starts_at)}</strong><span>${invalidDuration?"Verifica durata":duration+" min"}</span></div>
        <div class="crm-agenda-event-main"><div class="crm-agenda-event-heading"><strong>${esc(a.client_name||"Cliente")}</strong><span class="crm-agenda-event-state">${status}</span></div>
           <div class="crm-agenda-event-kind">${esc(visitLabel(a.activity_type))} · ${esc(a.technician_name||"Tecnico")}</div>
           ${address?`<div class="crm-agenda-event-address">${esc(address)}</div>`:""}
           ${info?`<details class="crm-agenda-notes"><summary>Indicazioni per Antonio <span>· ${esc(info.slice(0,95))}${info.length>95?"…":""}</span></summary><p>${esc(info)}</p></details>`:""}
        </div>
        <div class="crm-agenda-event-actions">
          ${a.phone?`<a class="crm-agenda-icon-link" href="tel:${esc(a.phone)}" aria-label="Chiama ${esc(a.client_name||"cliente")}" title="Chiama">☎</a>`:""}
          ${address?`<a class="crm-agenda-icon-link" href="${mapHref}" rel="noopener" target="_blank" aria-label="Navigatore" title="Navigatore">⌖</a>`:""}
          <button class="crm-agenda-icon-link" data-measures="${esc(a.id)}" title="Misure" aria-label="Apri misure">▤</button>
          ${profile.role==="admin"?`<button class="crm-agenda-edit-btn" data-edit="${esc(a.id)}">Modifica</button><button class="crm-agenda-danger-btn" data-remove-appt="${esc(a.id)}" aria-label="Elimina appuntamento" title="Elimina">×</button>`:""}
        </div>
      </article>`;
   }).join("");
   return `<section class="crm-agenda-day crm-agenda-busy"><div class="crm-agenda-date"><span class="crm-agenda-date-tile"><small>${esc(dayName)}</small><strong>${dateText.slice(0,2)}</strong></span><div><h3>${esc(dayText)} ${i===0?'<span class="crm-today-chip">OGGI</span>':""}</h3><p>${items.length} ${items.length===1?"appuntamento":"appuntamenti"}</p></div></div><div class="crm-agenda-event-list">${events}</div>${absencesHtml}${availability}</section>`;
 }).join("");
 return `<div class="crm-compact-agenda">${head}${rows}</div>`;
}

function technicianCalendar(){
  const monday=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
  const dateKey=d=>day(d.toISOString()),today=day(now());
  if(!weekMonday)weekMonday=monday(new Date());
  const dates=Array.from({length:7},(_,i)=>{const d=new Date(weekMonday);d.setDate(d.getDate()+i);return d;});
  const own=appts.filter(a=>a.technician_id===user.id&&a.status!=="cancelled");
  const ownAbsences=unavail.filter(u=>u.technician_id===user.id);
  const upcomingAbsences=ownAbsences.filter(u=>new Date(u.ends_at)>new Date()).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
  const absencesFor=d=>ownAbsences.filter(u=>new Date(u.starts_at)<new Date(d.getTime()+86400000)&&new Date(u.ends_at)>d);
  const visibleDates=dates.filter(d=>dateKey(d)===today||own.some(a=>day(a.starts_at)===dateKey(d))||absencesFor(d).length>0);
  if(!visibleDates.length)visibleDates.push(dates[0]);
  const q=weekSearch.toLocaleLowerCase("it").trim();
  const results=q?own.filter(a=>{const l=leads.find(l=>l.id===a.lead_id);return [a.client_name,a.phone,a.address,a.city,a.province,a.notes,a.activity_type,l?.full_name,l?.phone,l?.address].filter(Boolean).join(" ").toLocaleLowerCase("it").includes(q)}).sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at)):[];
  shell(`<div class="tech-calendar-head"><h2>Calendario</h2><p>Appuntamenti della settimana, indirizzi e ricerca clienti.</p></div>
  ${upcomingAbsences.length?`<div class="crm-absence-tech"><strong>Prossima indisponibilità</strong><span>${fmt(upcomingAbsences[0].starts_at)} → ${fmt(upcomingAbsences[0].ends_at)}</span><small>${esc(upcomingAbsences[0].reason||"Assenza")}</small></div>`:""}
  <div class="card"><div class="row" style="justify-content:space-between;align-items:center">
    <button class="btn ghost" id="weekPrev">← Settimana prima</button>
    <b>${fmtDate(dates[0])} – ${fmtDate(dates[6])}</b>
    <button class="btn ghost" id="weekNext">Settimana dopo →</button>
    <button class="btn blue" id="weekToday">Questa settimana</button></div>
    <div class="field"><label for="weekJump">Vai alla settimana della data</label><input type="date" id="weekJump" value="${dateKey(weekMonday)}"></div>
    <div class="row">${visibleDates.map(d=>{const key=dateKey(d),n=own.filter(a=>day(a.starts_at)===key).length;return `<button type="button" class="btn ${key===today?"ok":"ghost"}" data-weekday="${key}">${new Intl.DateTimeFormat("it-IT",{weekday:"short",day:"2-digit",timeZone:"Europe/Rome"}).format(d)} (${n})</button>`}).join("")}</div>
  </div>
  <form class="card" id="weekFind"><label for="weekSearch"><b>Cerca su tutto lo storico appuntamenti</b></label><div class="row" style="margin-top:8px"><input id="weekSearch" style="flex:1;min-width:160px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)" value="${esc(weekSearch)}" placeholder="Nome cliente, indirizzo, telefono"><button class="btn primary">Cerca</button><button class="btn ghost" type="button" id="weekReset">Cancella</button></div></form>
  ${q?`<div class="section">Risultati (${results.length})</div>${results.length?apptCards(results):'<div class="card">Nessun appuntamento trovato.</div>'}`:visibleDates.map(d=>{const key=dateKey(d),xs=own.filter(a=>day(a.starts_at)===key).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));return `<div id="week-day-${key}" style="scroll-margin-top:110px"><div class="section">${fmtDate(d)} · ${xs.length} appuntamenti</div>${absencesFor(d).map(u=>`<div class="crm-absence-tech"><strong>⛔ Indisponibile</strong><span>${fmtTime(u.starts_at)}–${fmtTime(u.ends_at)}</span><small>${esc(u.reason||"Assenza")}</small></div>`).join("")}${xs.length?apptCards(xs):'<div class="meta">Nessun appuntamento.</div>'}</div>`}).join("")}`);
  document.querySelector("#weekPrev").onclick=()=>{weekMonday.setDate(weekMonday.getDate()-7);weekSearch="";technicianCalendar()};
  document.querySelector("#weekNext").onclick=()=>{weekMonday.setDate(weekMonday.getDate()+7);weekSearch="";technicianCalendar()};
  document.querySelector("#weekToday").onclick=()=>{weekMonday=monday(new Date());weekSearch="";technicianCalendar()};
  document.querySelector("#weekJump").onchange=e=>{if(e.target.value){weekMonday=monday(new Date(e.target.value+"T12:00:00"));weekSearch="";technicianCalendar()}};
  document.querySelectorAll("[data-weekday]").forEach(b=>b.onclick=()=>document.getElementById("week-day-"+b.dataset.weekday)?.scrollIntoView({behavior:"smooth",block:"start"}));
  document.querySelector("#weekFind").onsubmit=e=>{e.preventDefault();weekSearch=document.querySelector("#weekSearch").value.trim();technicianCalendar()};
  document.querySelector("#weekReset").onclick=()=>{weekSearch="";technicianCalendar()};
  bindAgendaActions();
}
function availability(){
  if(profile.role==="technician"){technicianCalendar();return;}
  shell(`<div class="section">Agenda prossimi 7 giorni</div><div class="notice">Vedi impegni, clienti, indirizzi, durata e fasce ancora libere.</div>${richAgendaHtml(7)}`);
  bindAgendaActions();
}
function staff(){
 const future=unavail.filter(u=>new Date(u.ends_at)>new Date()).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
 const past=unavail.filter(u=>new Date(u.ends_at)<=new Date()).sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at));
 const card=u=>{
   const tech=techs.find(t=>t.id===u.technician_id);
   return `<div class="crm-unavailability-item"><div><strong>⛔ ${esc(tech?.full_name||"Tecnico")}</strong><span>${fmt(u.starts_at)} → ${fmt(u.ends_at)}</span><small>${esc(u.reason||"Indisponibile")}</small></div><button type="button" class="btn ghost" data-del-un="${esc(u.id)}">Elimina</button></div>`;
 };
 shell(`<div class="crm-absence-page"><div class="crm-absence-heading"><h2>Tecnici e indisponibilità</h2><button class="btn primary" id="addUn">+ Indisponibilità</button></div>
 <p class="crm-absence-help">Le assenze restano visibili anche quando sono programmate per i mesi successivi.</p>
 <section><h3>Indisponibilità future (${future.length})</h3><div class="crm-absence-list">${future.length?future.map(card).join(""):'<p class="crm-empty">Nessuna indisponibilità futura.</p>'}</div></section>
 <details class="crm-old-absence"><summary>Indisponibilità passate (${past.length})</summary><div class="crm-absence-list">${past.map(card).join("")||'<p class="crm-empty">Nessuna indisponibilità passata.</p>'}</div></details></div>`);
 document.querySelector("#addUn").onclick=()=>unavailabilityForm();
 document.querySelectorAll("[data-del-un]").forEach(b=>b.onclick=()=>deleteUnavailability(b.dataset.delUn));
}

function initCrmUpdateNotification(){
  const currentBuild=document.querySelector('meta[name="edoglo-build"]')?.getAttribute('content')||"";
  let running=false,lastCheck=0,dismissedBuild="";
  function showAvailable(remoteBuild){
    if(dismissedBuild===remoteBuild||document.querySelector("#edoglo-update-alert"))return;
    const box=document.createElement("aside");box.id="edoglo-update-alert";box.setAttribute("role","status");
    const heading=document.createElement("strong");heading.textContent="È disponibile una nuova versione del CRM";
    const info=document.createElement("p");info.textContent="Salva le modifiche in corso, poi aggiorna per vedere tutte le nuove schermate.";
    const buttons=document.createElement("div");buttons.className="edoglo-update-actions";
    const update=document.createElement("button");update.type="button";update.className="edoglo-update-now";update.textContent="Aggiorna CRM";
    update.onclick=()=>{location.assign(location.pathname+"?__crm_updated="+encodeURIComponent(remoteBuild)+"&t="+Date.now());};
    const later=document.createElement("button");later.type="button";later.className="edoglo-update-later";later.textContent="Più tardi";
    later.onclick=()=>{dismissedBuild=remoteBuild;box.remove();};
    buttons.append(update,later);box.append(heading,info,buttons);document.body.appendChild(box);
  }
  async function checkVersion(force=false){
    if(document.hidden||running||(!force&&Date.now()-lastCheck<60000))return;
    lastCheck=Date.now();running=true;
    try{
      const url=location.pathname+"?__crm_version_check="+Date.now();
      const resp=await fetch(url,{cache:"no-store",credentials:"same-origin"});
      if(!resp.ok)return;
      const remoteDoc=new DOMParser().parseFromString(await resp.text(),"text/html");
      const build=remoteDoc.querySelector('meta[name="edoglo-build"]')?.getAttribute("content");
      if(build&&currentBuild&&build!==currentBuild)showAvailable(build);
    }catch(err){ /* Offline or network problem: silently retry at the next check. */ }
    finally{running=false;}
  }
  window.addEventListener("focus",()=>checkVersion());
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkVersion();});
  setInterval(()=>checkVersion(),120000);
}
initCrmUpdateNotification();

start().catch(e=>{
  app.innerHTML=`<div class="login"><div class="msg error">${esc(e.message)}</div></div>`;
});
</script>
